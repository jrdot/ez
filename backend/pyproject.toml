[project]
name = "backend"
version = "0.1.0"
description = "ezwire FastAPI backend"
readme = "README.md"
authors = [
    { name = "JR", email = "jung3211@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.1,<2",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx2",
    "pytest>=8.4.2,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
